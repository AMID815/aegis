<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!--
  connect-src 의 Worker 주소는 app.js 의 WORKER_URL 상수와 정확히 같은
  문자열이어야 한다(호스트만, 끝 슬래시 없이). 2026-08-20 배포로 채워졌다
  — Worker 를 다시 배포해 주소가 바뀌면 여기와 app.js 두 곳을 같이 고칠 것.
  둘 중 하나만 바꾸면(또는 둘 다 자리표시자 그대로면) fetch 가 여기 CSP 에
  막혀 거부되는데, app.js 는 이걸 "Worker 연결 실패"와 구분하지 않고 같은
  깃허브 폴백 경로로 처리한다 — 조용히 고장 나는 대신 조용히 폴백만 계속
  쓰는 상태가 된다(안전하지만 의도한 대로 Worker 를 쓰고 있는지는 따로
  확인해야 한다).
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://raw.githubusercontent.com https://mouigosa-intake.amid815.workers.dev; script-src 'self'; style-src 'self'">
<!--
  검색이 지나가는 사람이 이 페이지에 닿는 가장 흔한 경로다. noindex 는
  값싸고, 아래 통과 커튼(#gate)보다 오히려 이 경로엔 더 실효적이다 —
  검색엔진이 아예 안 걸어주면 그 사람은 이 URL 자체를 모른다.
-->
<meta name="robots" content="noindex, nofollow">
<title>모의고사</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  통과 커튼(passphrase curtain) — 잠금이 아니다. positions.json 은 인증
  없이 누구나 raw.githubusercontent.com 에서 직접 받을 수 있다(실측
  2026-08-20: 200, 인증 없음, 381바이트). 이 화면이 막는 건 "그 URL을
  아는 사람"이 아니라 "지나가다 이 페이지를 그냥 열어본 사람"이다 —
  사용자가 그 구분을 알고 선택했다. 이 문구 자체는 그 사실을 화면에
  드러내지 않는다(드러내면 커튼의 대상인 바로 그 사람에게 우회로를
  알려주는 셈이다) — 근거와 전체 설명은 app.js 의 통과 커튼 절과 이
  작업의 보고서에 있다.

  #content 는 여기서 정적으로 hidden 이다(app.js 가 나중에 켜는 게
  아니라) — CSP 의 style-src 'self' 가 인라인 <style> 도 막아서, 첫
  페인트 전에 숨기려면 static hidden + style.css 의 [hidden] 규칙뿐이다.
  그래서 이 안의 #q/#price/#date 는 **정적** required 를 두지 않는다 —
  숨은 조상 아래 정적 required 가 있으면 tests/test_index_html.py 의
  "숨겨진 required" 가드(2026-08-20 실사고 재현 방지용)가 그대로 걸린다.
  app.js 가 #content 를 열 때 이 세 필드의 required 도 같이 켠다(기존
  setExitFieldsVisible() 이 exit 필드에 쓰던 것과 같은 패턴).
-->
<div id="gate" class="gate">
  <h1>모의고사</h1>
  <form id="gate-form" autocomplete="off">
    <div class="field">
      <label for="gate-pass">접근 코드</label>
      <input id="gate-pass" type="password" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </div>
    <button type="submit" id="gate-submit">확인</button>
    <p id="gate-error" class="gate-error" role="alert" hidden></p>
  </form>
</div>

<div id="content" hidden>
<header>
  <h1>모의고사</h1>
  <div id="stale" class="stale" role="status" aria-live="polite" hidden></div>
  <div id="asof" class="asof"></div>
</header>

<section id="summary"></section>

<section>
  <h2>보유 중</h2>
  <div class="table-wrap">
  <table id="open"><thead><tr>
    <th>종목</th><th>매입가</th><th>현재가</th><th>수익률</th><th>보유</th><th>출처</th>
  </tr></thead><tbody></tbody></table>
  </div>
</section>

<section>
  <h2>종결</h2>
  <div class="table-wrap">
  <table id="closed"><thead><tr>
    <th>종목</th><th>매입가</th><th>매도가</th><th>수익률</th><th>보유</th><th>출처</th>
  </tr></thead><tbody></tbody></table>
  </div>
</section>

<section>
  <h2>기록 추가</h2>

  <!--
    app.js 계약 (Task 12/13이 구현) — 이 폼은 매입/매도 겸용이다.
    #q 에 고른 종목이 STATE.positions 중 status:"open" 과 코드가 일치하면
    "매도 모드"로 전환하되, 그 사실을 화면에 반드시 드러낼 것 — 매입가 칸에
    매도가를 조용히 입력하게 두면 안 된다 (Task 11 지시사항의 알려진 결함).

    전환 시 app.js가 설정해야 하는 것 (매입 모드 복귀 시 반대로 되돌릴 것):
      - #mode        : hidden=false, textContent="매도 입력 — 보유 중인 종목입니다" 등.
                       기본(매입)일 때는 hidden=true.
      - #price-label : textContent를 "매도가"로. 기본값은 "매입가".
      - #source-field: 출처 select를 감싼 div. hidden=true로 숨긴다 — 매도에는
                       출처가 의미 없다. 매입 모드에서는 hidden=false.
      - (선택) #form 의 data-mode 속성을 "sell"/"buy"로 맞춰 CSS 훅으로 쓸 수 있다.
      - (선택) #submit-btn 의 문구를 "매도 이슈 열기" 등으로 바꿔도 된다 — 필수는 아님.
    지금은 app.js가 없으므로 위 요소는 전부 매입 모드 기본값 그대로 보인다.
  -->
  <!--
    Task 15: amend 를 세 번째 모드로 확장한다(app.js 구현). 새 계약을 따로
    만들지 않고 위 매입/매도 전환 계약을 그대로 늘린다.

    표의 각 행에 app.js 가 렌더링하는 "고치기" 버튼(이 파일엔 마크업 없음,
    renderTable 이 만든다)을 누르면 이 폼이 amend 모드로 전환된다.
      - #mode 는 "고치기 - 기존 기록을 고치는 중입니다" 로.
      - #price-label 은 "매입가" 그대로 - amend 도 buy.price 를 이 필드로 받는다.
      - #source-field 는 hidden=false - 출처도 고칠 수 있다.
      - #form 의 data-mode="amend".
      - #submit-btn 문구가 바뀐다.
      - #cancel-btn 이 hidden=false 로 나타난다. 매입/매도는 #q 로 고른 종목의
        보유 여부로 암묵 전환되지만, amend 는 버튼으로 명시적으로 들어오므로
        나가는 길도 명시적이어야 한다.
      - #signal-date-field 가 hidden=false - signal_date 를 고칠 수 있는
        유일한 경로다(매입 폼에는 이 필드 자체가 없다).
      - #exit-price-field / #exit-date-field / #exit-reason-field 는 대상
        기록에 exits 가 이미 있을 때만 hidden=false 로 켠다. models.apply_amend
        는 exits 가 없는 기록에 exit 패치를 주면 거부한다 - 그래서 이 판정은
        status 가 아니라 exits 배열이 비었는지를 따른다. status="closed" 인데
        exits=[] 인 손편집 기록(표에서 "상태 불일치"로 표시됨)은 이 화면에서
        "매수만 고칠 수 있는" 기록으로 보이는데, 이는 실제로 exit 패치를 줄 수
        없는 서버 판정과 일치한다.
      - #q 는 amend 모드에서도 계속 자동완성 입력란이다. 종목을 바꾸면 새
        code/name 페어가 patch 에 실린다(code 단독으로는 못 보낸다). amend 모드
        중에는 #q 를 바꿔도 매입/매도 자동 전환이 일어나지 않는다.
  -->
  <form id="form" autocomplete="off" data-mode="buy">
    <!--
      Task 13(지정가 관찰): 입력 방식 선택 — 폼 맨 앞에 둬서 나머지 필드가
      뭘 요구하는지(매입가 대 지정가) 먼저 정하고 들어가게 한다. 이 셀렉트
      는 app.js updateMode()/applyMode() 계약을 하나 더 늘린다: 값이
      "watch"면 #q 로 고른 종목의 보유 여부와 무관하게 지정가 관찰 모드를
      유지한다(매입/매도 자동판정에 안 밀린다).
    -->
    <div class="field" id="entry-mode-field">
      <label for="entry-mode">입력 방식</label>
      <select id="entry-mode">
        <option value="buy">지금 관측 (오늘 가격으로 시작)</option>
        <option value="watch">지정가 관찰 (그 가격에 닿으면 시작)</option>
      </select>
    </div>
    <div class="field">
      <label for="q">종목명 또는 코드</label>
      <!--
        required 를 여기 정적으로 두지 않는다 — 이 필드는 #content(위
        통과 커튼 주석 참조) 아래 있고, #content 는 처음엔 정적으로
        hidden 이다. app.js 가 #content 를 열 때(revealContent()) 이
        required 도 같이 켠다.
      -->
      <input id="q" placeholder="예: 삼성전자 또는 005930" list="cands"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <datalist id="cands"></datalist>
    </div>

    <div id="mode" class="mode" hidden></div>

    <div class="field" id="price-field">
      <label id="price-label" for="price">매입가</label>
      <!--
        type=number 대신 text+inputmode=numeric을 쓴다: 매입가를 "247,500"처럼
        콤마 포함으로 붙여넣으면 type=number 입력란은 값을 통째로 버린다(빈 값이
        되거나 붙여넣기 자체가 막힌다). app.js는 Number() 로 변환하기 전에
        콤마·공백을 제거할 것.
      -->
      <!-- required 는 #price 에도 정적으로 두지 않는다 — #q 바로 위 주석과 같은 이유. -->
      <input id="price" type="text" inputmode="numeric" placeholder="매입가">
    </div>
    <!--
      지정가 관찰 모드에서만 보인다(#entry-mode=watch). #price 와 같은 이유로
      type=number 를 쓰지 않는다 — "247,500"처럼 콤마 포함 값이 통째로
      버려진다. required 도 여기 정적으로 두지 않는다: hidden 조상 아래
      정적 required 가 있으면 tests/test_index_html.py 의 가드에 걸리고,
      실제로도 이 페이지가 이미 한 번 겪은 사고(콘솔에만 남는 죽은 submit)
      를 그대로 재현한다. app.js 의 setWatchFieldVisible() 이 hidden 과
      required 를 같이 켜고 끈다.
    -->
    <div class="field" id="watch-field" hidden>
      <label for="watch-price">지정가 (이 가격에 닿으면 매수)</label>
      <input id="watch-price" type="text" inputmode="numeric" autocomplete="off">
    </div>
    <!--
      "며칠 이내에 N원에 닿으면 자동 매수" — 이 필드가 그 "며칠 이내에"다.
      #watch-field 와 같은 이유로 type=number 를 안 쓴다("247,500" 붙여넣기
      방지와는 무관하지만 이 폼의 다른 숫자 입력과 규칙을 통일한다) —
      parsePrice() 가 콤마·공백을 지운 뒤 정수인지 확인한다. required 도
      여기 정적으로 두지 않는다: hidden 조상 아래 정적 required 가 있으면
      tests/test_index_html.py 의 가드에 걸리고, 실제로도 이 페이지가 이미
      겪은 사고(콘솔에만 남는 죽은 submit)를 재현한다. app.js 의
      setWatchFieldVisible() 이 #watch-field 와 함께 hidden·required 를 켜고 끈다.
    -->
    <div class="field" id="watch-days-field" hidden>
      <label for="watch-days">관찰 기간 (거래일)</label>
      <input id="watch-days" type="text" inputmode="numeric" autocomplete="off" value="5">
    </div>
    <div class="field">
      <label for="date">매입일</label>
      <!-- required 는 #date 에도 정적으로 두지 않는다 — #q 바로 위 주석과 같은 이유. -->
      <input id="date" type="date">
    </div>
    <div class="field" id="exit-price-field" hidden>
      <label for="exit-price">매도가</label>
      <!--
        required 를 여기 정적으로 두지 않는다 — hidden(=display:none) 인
        컨트롤에 required 가 걸려 있으면 constraint validation 이 그 필드에서
        막혀 버리는데, 포커스를 받을 수 없는 요소라 브라우저가 아예 submit
        이벤트를 내보내지 않는다(콘솔에만 "not focusable" 오류가 남는다).
        매입/매도/열린 기록 amend 등 이 필드가 숨어 있는 모든 경로가
        전부 이 방식으로 막혔었다(리뷰 C1, 실측). app.js 의
        setExitFieldsVisible() 가 hidden 을 켤 때 required 도 같이 켠다.
      -->
      <input id="exit-price" type="text" inputmode="numeric" placeholder="매도가">
    </div>
    <div class="field" id="exit-date-field" hidden>
      <label for="exit-date">매도일</label>
      <input id="exit-date" type="date">
    </div>
    <div class="field" id="exit-reason-field" hidden>
      <label for="exit-reason">매도 사유(선택)</label>
      <input id="exit-reason" placeholder="매도 사유(선택)" maxlength="40">
    </div>
    <div class="field" id="source-field">
      <label for="source">출처</label>
      <select id="source">
        <option>수동</option><option>상단눌림</option><option>상대강도</option>
        <option>눌림베팅</option><option>종가베팅</option>
      </select>
    </div>
    <div class="field" id="signal-date-field" hidden>
      <label for="signal-date">시그널일(선택)</label>
      <input id="signal-date" type="date">
    </div>
    <div class="field">
      <label for="memo">메모(선택)</label>
      <input id="memo" placeholder="메모(선택)" maxlength="200">
    </div>
    <button type="submit" id="submit-btn">저장</button>
    <button type="button" id="cancel-btn" hidden>취소</button>
  </form>
  <!--
    #result — 제출 결과를 이 화면 안에서 바로 보여준다(Worker 연동, app.js
    writeRecord()/renderResult() 가 채운다). 성공/폴백/막힘 세 종류를 클래스로
    구분한다(style.css). #stale 과 같은 textContent 전용·role=status 패턴을
    쓴다 — 다만 성공 시 이슈 링크 하나(<a>)는 예외적으로 자식 요소로 만든다
    (그것도 createElement + textContent 로만 채운다, innerHTML 은 여전히
    어디서도 안 쓴다).
  -->
  <div id="result" class="result" role="status" aria-live="polite" hidden></div>
  <p class="hint">버튼을 누르면 우선 저장을 바로 시도합니다. Worker 에 닿지 않으면
    깃허브 이슈 화면이 대신 열립니다 — 그때는 거기서 한 번 더 눌러야 반영됩니다.</p>
</section>

</div><!-- #content -->

<script src="app.js"></script>
</body>
</html>
