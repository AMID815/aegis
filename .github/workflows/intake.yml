name: intake
# 이슈 → positions.json.
#
# 공개 리포라 **누구나 이슈를 연다.** 작성자 확인은 반드시 job 레벨이어야 한다 —
# step 레벨에 걸면 job 자체는 실행되어 남의 입력으로 로그가 남는다.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  # quotes/close 와 **다른 그룹**이다. 같은 그룹에 넣으면, 큐에 하나만 대기할 수
  # 있는 깃허브 규칙 때문에 이슈가 몰릴 때 조용히 취소될 수 있다 — 그러면 이슈에
  # 아무 댓글도 안 달린 채 사라진다. 쓰는 파일이 서로 달라 충돌하지도 않는다.
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 본문 반영
        id: apply
        # 종료코드로 job 이 죽지 않게 받아서 출력으로 넘긴다.
        # intake 의 stdout 이 사용자에게 보여줄 유일한 진단이다
        # (어느 항목이 손상됐는지, 이미 반영된 건지 등).
        run: |
          set +e
          out=$(python -m scripts.intake 2>&1); rc=$?
          set -e
          # 구분자를 고정 문자열로 두면 출력에 그 줄이 섞일 때 깨진다.
          # 출력에는 사용자가 쓴 메모·종목명이 들어올 수 있다.
          delim="EOF_$(openssl rand -hex 12)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "out<<$delim"
            echo "$out"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "$out"
          exit 0
        env:
          # ${{ }} 를 셸 문자열에 직접 넣으면 주입된다. 반드시 환경변수로.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: 결과를 이슈에 남긴다
        if: always()
        # 종료코드마다 사용자가 할 일이 다르다. 하나로 뭉뚱그리면
        # "고쳐서 다시 내라" 를 잘못된 상황에 안내하게 되고, 그 말을 따라
        # 날짜를 바꿔 다시 내면 **틀린 기록이 진짜로 쓰인다.**
        run: |
          # 진단을 코드블록에 담아 붙인다. 작은따옴표 안이라 백틱은 그대로 문자다.
          body() { printf '%s\n\n```\n%s\n```\n' "$1" "$OUT"; }

          case "$RC" in
            0) gh issue close   "$NUM" -c "$(body '반영했습니다.')" ;;
            4) gh issue close   "$NUM" -c "$(body '이미 반영되어 있습니다. 추가 조치가 필요 없습니다.')" ;;
            2) gh issue comment "$NUM" -b "$(body '입력을 반영하지 못했습니다. 값을 고쳐 다시 등록해주세요.')" ;;
            3) gh issue comment "$NUM" -b "$(body '**positions.json 을 믿을 수 없어 아무것도 쓰지 않았습니다.** 파일을 손으로 고치기 전에는 재제출해도 반영되지 않습니다.')" ;;
            *) gh issue comment "$NUM" -b "$(body "예기치 못한 오류입니다 (rc=$RC). Actions 로그를 확인해주세요.")" ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          RC: ${{ steps.apply.outputs.rc }}
          OUT: ${{ steps.apply.outputs.out }}
