name: quotes
# 장중 30분 갱신. KST 09:00~16:30 = UTC 00:00~07:30.
# cron 은 UTC 기준이고 이 창은 하루 안에서 닫히므로 요일 필터(1-5)가 KST 평일과 일치한다.
#
# **창이 16:30 까지인 이유**: 수능일(2026-11-19)은 KRX 가 1시간 지연 운영한다
# — 개장 10:00, 마감 16:30(공용 노트 `시장달력_공유노트.md` §2). 예전 창
# (~15:30)이면 그날 마지막 한 시간의 시세를 화면이 못 봤다.
#
# 자동 체결 판정에는 영향이 없었다 — 판정은 일봉·분봉으로 하고(scripts/autofill.py)
# 이 폴링은 화면 표시 전용이다. 순수하게 "보는 값이 한 시간 낡는" 문제였다.
#
# 대가: 평소(마감 15:30)에는 16:00·16:30 두 번이 마감 뒤라 가격이 안 변하는데도
# **커밋은 된다.** should_commit() 은 "전부 실패"만 거르지 "값이 그대로"는 안 거르고,
# 스냅샷의 as_of_kst 가 매번 달라져 내용이 항상 다르기 때문이다. 즉 data 브랜치에
# 평일 2커밋이 더 쌓인다(기존 14 → 16, +14%).
#
# 그 값을 치르는 이유: 날짜 하드코딩(SHIFT = {"20261119": 60}) 없이 지연 개장일이
# 자동으로 덮인다 — 공용 노트 §2-1 이 권하는 방향이고, 임시로 지정되는 조기폐장·
# 지연개장에도 그대로 대응한다. 커밋 수가 문제가 되면 "직전 스냅샷과 가격이
# 같으면 안 쓴다"를 quotes.py 에 넣는 게 맞지, 창을 다시 좁히는 건 아니다.

on:
  schedule:
    - cron: "0,30 0-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write        # 2023-02 이후 기본이 read — 없으면 첫 커밋부터 403

concurrency:
  group: data-write      # close 와 공유. 둘 다 quotes.json 을 쓴다
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.quotes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
