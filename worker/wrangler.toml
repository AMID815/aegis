# 모의고사 쓰기 프록시 — Cloudflare Worker 설정.
# 배포/시크릿 설정 절차는 worker/README.md 를 따를 것. 이 파일에는 시크릿을
# 절대 평문으로 적지 않는다 — GATE_PASS/GH_TOKEN 은 `wrangler secret put` 으로만
# 넣는다(README 참고). 이 파일 자체는 저장소에 커밋되어 공개된다.

name = "mouigosa-intake"
main = "worker.js"
# 이 세션의 시스템 날짜가 미래(2026년)로 맞춰져 있어, 그 날짜를 그대로 쓰면
# 실제 Cloudflare 서버 기준으로는 "아직 안 온 날짜"라 wrangler deploy 가
# 거부할 위험이 있다 — 그래서 이미 지나 안전하다고 알려진 과거 날짜를 쓴다.
# 이 값은 이 Worker 가 쓰는 최소한의 런타임 API(fetch, crypto.subtle, JSON)
# 하고만 관련 있고 이런 기본 기능은 이보다 훨씬 이전부터 안정적이었으므로,
# 실제 배포 시점에 더 최근 날짜로 바꿔도 무방하다(바꾸고 싶다면 배포 당일
# 날짜로 그냥 덮어써도 된다).
compatibility_date = "2024-09-23"

# 무료 플랜 기본값 그대로 — 이 Worker 는 요청당 짧은 작업(패스프레이즈 확인
# + 깃허브 이슈 생성 API 호출) 하나만 하므로 별도 설정이 필요 없다.

# 2026-08-20 보안 리뷰 minor — `npx wrangler tail` 은 그 명령을 실행 중일
# 때만 보이는 실시간 로그다. 아무도 tail 하고 있지 않을 때 실패(예: 시크릿
# 오설정, 깃허브 쪽 오류)가 나면 그 순간은 그냥 사라진다. Logpush 없이도
# 대시보드에서 지난 요청을 나중에 되짚어볼 수 있게 관측을 켠다 — 이 Worker
# 트래픽량(개인 도구, 하루 몇 건)에서는 무료 한도 안이다.
[observability]
enabled = true
