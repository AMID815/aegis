<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://raw.githubusercontent.com; script-src 'self'; style-src 'self'">
<title>모의고사</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>모의고사</h1>
  <div id="stale" class="stale" role="status" aria-live="polite" hidden></div>
  <div id="asof" class="asof"></div>
</header>

<section id="summary"></section>

<section>
  <h2>보유 중</h2>
  <div class="table-wrap">
  <table id="open"><thead><tr>
    <th>종목</th><th>매입가</th><th>현재가</th><th>수익률</th><th>보유</th><th>출처</th>
  </tr></thead><tbody></tbody></table>
  </div>
</section>

<section>
  <h2>종결</h2>
  <div class="table-wrap">
  <table id="closed"><thead><tr>
    <th>종목</th><th>매입가</th><th>매도가</th><th>수익률</th><th>보유</th><th>출처</th>
  </tr></thead><tbody></tbody></table>
  </div>
</section>

<section>
  <h2>기록 추가</h2>

  <!--
    app.js 계약 (Task 12/13이 구현) — 이 폼은 매입/매도 겸용이다.
    #q 에 고른 종목이 STATE.positions 중 status:"open" 과 코드가 일치하면
    "매도 모드"로 전환하되, 그 사실을 화면에 반드시 드러낼 것 — 매입가 칸에
    매도가를 조용히 입력하게 두면 안 된다 (Task 11 지시사항의 알려진 결함).

    전환 시 app.js가 설정해야 하는 것 (매입 모드 복귀 시 반대로 되돌릴 것):
      - #mode        : hidden=false, textContent="매도 입력 — 보유 중인 종목입니다" 등.
                       기본(매입)일 때는 hidden=true.
      - #price-label : textContent를 "매도가"로. 기본값은 "매입가".
      - #source-field: 출처 select를 감싼 div. hidden=true로 숨긴다 — 매도에는
                       출처가 의미 없다. 매입 모드에서는 hidden=false.
      - (선택) #form 의 data-mode 속성을 "sell"/"buy"로 맞춰 CSS 훅으로 쓸 수 있다.
      - (선택) #submit-btn 의 문구를 "매도 이슈 열기" 등으로 바꿔도 된다 — 필수는 아님.
    지금은 app.js가 없으므로 위 요소는 전부 매입 모드 기본값 그대로 보인다.
  -->
  <form id="form" autocomplete="off" data-mode="buy">
    <div class="field">
      <label for="q">종목명 또는 코드</label>
      <input id="q" placeholder="예: 삼성전자 또는 005930" list="cands"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <datalist id="cands"></datalist>
    </div>

    <div id="mode" class="mode" hidden></div>

    <div class="field">
      <label id="price-label" for="price">매입가</label>
      <!--
        type=number 대신 text+inputmode=numeric을 쓴다: 매입가를 "247,500"처럼
        콤마 포함으로 붙여넣으면 type=number 입력란은 값을 통째로 버린다(빈 값이
        되거나 붙여넣기 자체가 막힌다). app.js는 Number() 로 변환하기 전에
        콤마·공백을 제거할 것.
      -->
      <input id="price" type="text" inputmode="numeric" placeholder="매입가" required>
    </div>
    <div class="field">
      <label for="date">매입일</label>
      <input id="date" type="date" required>
    </div>
    <div class="field" id="source-field">
      <label for="source">출처</label>
      <select id="source">
        <option>수동</option><option>상단눌림</option><option>상대강도</option>
        <option>눌림베팅</option><option>종가베팅</option>
      </select>
    </div>
    <div class="field">
      <label for="memo">메모(선택)</label>
      <input id="memo" placeholder="메모(선택)" maxlength="200">
    </div>
    <button type="submit" id="submit-btn">깃허브에서 저장</button>
  </form>
  <p class="hint">버튼을 누르면 깃허브 이슈 화면이 열립니다. 거기서 한 번 더 누르면 반영됩니다.</p>
</section>

<script src="app.js"></script>
</body>
</html>
